[package]
name = "turbogit"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
dirs = "6.0"
eframe = "0.36.1"
egui = "0.36.1"
egui_dock = "0.21.1"
egui_extras = "0.36.1"
gix = { version = "0.87.0", default-features = false, features = ["status", "blob-diff", "blame", "sha1"], optional = true }
log = "0.4.34"
ron = "0.12.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"

[dev-dependencies]
crossbeam-channel = "0.5.16"
egui_kittest = { version = "0.36.1", features = ["snapshot", "wgpu"] }
tempfile = "3.27.0"

# Optional fast read-path; all mutating ops always go through the git CLI.
[features]
default = []
gix-reader = ["dep:gix"]
