[package]
name = "turbogit"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
eframe = "0.35.0"
egui = "0.35.0"
egui_dock = "0.20.1"
egui_extras = "0.35.0"
gix = { version = "0.86.0", default-features = false, features = ["status", "blob-diff", "blame"], optional = true }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"

# Optional fast read-path; all mutating ops always go through the git CLI.
[features]
default = []
gix-reader = ["dep:gix"]
