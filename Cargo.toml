[package]
name = "turbogit"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# The one commit-message parser (ADR-0028 D2). Tooling-only — the `default`
# feature is `["cli"]`, which drags clap in for a bin we never run.
cocogitto = { version = "7.0.0", default-features = false }
crossbeam-channel = "0.5.16"
# The pixel-diff metric egui_kittest uses to decide a snapshot comparison; a
# direct dependency so a suite can report the same number the verdict is made
# from. `default-features = false` mirrors egui_kittest's own declaration — with
# defaults on, dify drags `image/default` (AVIF, EXR, GIF codecs) into the lock.
dify = { version = "0.8.0", default-features = false }
dirs = "6.0"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = "0.36.1"
egui_kittest = { version = "0.36.1", features = ["snapshot", "wgpu"] }
git2 = "0.21.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4.34"
nucleo-matcher = "0.3.1"
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"

turbogit-domain = { path = "crates/turbogit-domain" }
turbogit-engine-api = { path = "crates/turbogit-engine-api" }
turbogit-engine = { path = "crates/turbogit-engine" }
turbogit-services = { path = "crates/turbogit-services" }
turbogit-app = { path = "crates/turbogit-app" }
turbogit-ui = { path = "crates/turbogit-ui" }
test-support = { path = "crates/test-support" }

[workspace.lints.rust]
warnings = "deny"
# This is a rustc lint, NOT `clippy::unreachable_pub` — the clippy-namespaced
# form is an unknown lint on this toolchain and fails the build with E0602
# before linting a single file.
unreachable_pub = "deny"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
turbogit-app = { workspace = true }
turbogit-ui = { workspace = true }

[dev-dependencies]
# Installs `.cargo-husky/hooks/*` into `.git/hooks` on build (ADR-0028 D3).
# `default-features = false` is load-bearing: the defaults generate their own
# cargo-running hook scripts, while `user-hooks` makes cargo-husky a pure
# installer for the scripts the repo commits.
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
similar = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true }
turbogit-domain = { workspace = true }
turbogit-engine = { workspace = true }
turbogit-engine-api = { workspace = true }
turbogit-services = { workspace = true }

[lints]
workspace = true
