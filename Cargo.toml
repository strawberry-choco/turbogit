[package]
name = "turbogit"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

# Single source of truth for every shared dependency version in the workspace.
[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
dirs = "6.0"
eframe = "0.36.1"
egui = "0.36.1"
egui_dock = "0.21.1"
egui_extras = "0.36.1"
egui_kittest = { version = "0.36.1", features = ["snapshot", "wgpu"] }
git2 = "0.21.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4.34"
nucleo-matcher = "0.3.1"
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"

turbogit-domain = { path = "crates/turbogit-domain" }
turbogit-engine-api = { path = "crates/turbogit-engine-api" }
turbogit-engine = { path = "crates/turbogit-engine" }
turbogit-services = { path = "crates/turbogit-services" }
turbogit-app = { path = "crates/turbogit-app" }
turbogit-ui = { path = "crates/turbogit-ui" }
test-support = { path = "crates/test-support" }

# Clippy deny-warnings configuration, inherited by every member via
# `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
# Ratchets the adjacent class of dead visibility: a `pub` item trapped inside a
# private `mod` fails the build instead of waiting for a human.
#
# It does NOT close the hole the trimming plan was written against. Every crate
# here is a library, so a `pub` fn in a `pub mod` is genuinely reachable from
# outside — anyone can name it. `unreachable_pub` needs an item unreachable from
# *outside the crate*; `dead_code` needs an item unreachable at all; the
# widely-named-but-uncalled `pub fn` this workspace is full of is neither, so no
# per-crate lint can see it. Measured here: this lint produces ZERO findings on
# this tree, while a planted `pub fn` in a private `mod` fails immediately.
# "No other crate calls this" is a whole-workspace property; only a text sweep
# computes it. Do not read the clean run as "no dead pub items remain".
#
# This is a rustc lint, NOT `clippy::unreachable_pub` — the clippy-namespaced
# form is an unknown lint on this toolchain and fails the build with E0602
# before linting a single file.
unreachable_pub = "deny"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
turbogit-app = { workspace = true }
turbogit-ui = { workspace = true }

# The cross-layer parity suite is the root's one test that legitimately spans
# every crate; those consumers are dev-only.
[dev-dependencies]
similar = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true }
turbogit-domain = { workspace = true }
turbogit-engine = { workspace = true }
turbogit-engine-api = { workspace = true }
turbogit-services = { workspace = true }

[lints]
workspace = true
