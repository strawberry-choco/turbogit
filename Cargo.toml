[package]
name = "turbogit"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

# Single source of truth for every shared dependency version in the workspace.
[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.16"
dirs = "6.0"
eframe = "0.36.1"
egui = "0.36.1"
egui_dock = "0.21.1"
egui_extras = "0.36.1"
egui_kittest = { version = "0.36.1", features = ["snapshot", "wgpu"] }
git2 = "0.21.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4.34"
nucleo-matcher = "0.3.1"
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"

turbogit-domain = { path = "crates/turbogit-domain" }
turbogit-engine-api = { path = "crates/turbogit-engine-api" }
turbogit-engine = { path = "crates/turbogit-engine" }
turbogit-services = { path = "crates/turbogit-services" }
turbogit-app = { path = "crates/turbogit-app" }
turbogit-ui = { path = "crates/turbogit-ui" }
test-support = { path = "crates/test-support" }

# Clippy deny-warnings configuration, inherited by every member via
# `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[dependencies]
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
egui_extras = { workspace = true }
git2 = { workspace = true }
image = { workspace = true }
log = { workspace = true }
nucleo-matcher = { workspace = true }
rfd = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
similar = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
crossbeam-channel = { workspace = true }
egui_kittest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []

[lints]
workspace = true
