name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macos
            target: macos
          - os: windows-latest
            os_name: windows
            target: windows
          - os: ubuntu-24.04
            os_name: linux
            target: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The CLI and the crates share the 0.5 line; the installer links nsh
      # into ~/.local/bin, which is not on PATH by default.
      - name: Install nsh (unix)
        if: runner.os != 'Windows'
        env:
          NSH_VERSION: v0.5.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install nsh (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.5.0'
          irm https://nsh.dev/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The nsh Linux backend needs GTK 4.14 and glibc 2.39, the Ubuntu 24.04
      # floor (ADR-0035).
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev clang

      - name: Build the bundle
        working-directory: crates/turbogit-ui
        run: nsh package --target ${{ matrix.target }} --out "${{ github.workspace }}/dist"

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "dist/TurboGit.app" "artifact/turbogit-${GITHUB_REF_NAME}-macos.zip"

      - name: Collect the Linux bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifact
          cp dist/*.tar.gz artifact/

      - name: Collect the Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/*.zip artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: turbogit-${{ matrix.os_name }}
          path: artifact/*

  release:
    name: Release notes and publish
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      # Full history: the notes are generated from the commits up to the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cocogitto
        run: cargo install cocogitto@7.0.0 --locked
      - name: Generate the release notes
        run: cog changelog --at "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" dist/*
