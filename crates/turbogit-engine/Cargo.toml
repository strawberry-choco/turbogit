[package]
name = "turbogit-engine"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { workspace = true }
git2 = { workspace = true }
turbogit-domain = { workspace = true }
turbogit-engine-api = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The shared `git()` runner and repo recipes. Cargo permits this dev-dependency
# cycle because `test-support` depends on this crate only as a dev-dependency,
# which is never built for a downstream consumer.
test-support = { workspace = true }
# A self-dev-dependency so the engine's own suites can drive the fake — the
# substitutable adapter is feature-gated, and the question "can a fixture answer
# this read without a git binary?" is an engine question.
turbogit-engine = { path = ".", features = ["test-util"] }

[features]
test-util = []

[lints]
workspace = true
