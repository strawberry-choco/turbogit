[package]
name = "turbogit-ui-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
turbogit-app = { workspace = true }
turbogit-domain = { workspace = true }
nsh-core = { workspace = true }
nsh-base = { workspace = true }
env_logger = { workspace = true }
chrono = { workspace = true }

# The platform backends, at the feature set the n0 spike proved. The editor
# and shader features are what `nsh-base`'s components need; the rest carry
# the surfaces later phases mount. One backend per target OS.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = [
    "shader",
    "editor",
    "emoji-picker",
    "highlight",
    "math",
    "plot",
    "rich-editor",
    "term",
] }

[dev-dependencies]
libc = "0.2"
serde_json = "1"
nsh-engine = { workspace = true }
nsh-testing = { workspace = true }
tempfile = { workspace = true }
test-support = { workspace = true, features = ["nsh"] }
egui = { workspace = true }
egui_kittest = { workspace = true }
turbogit-engine = { workspace = true }
turbogit-ui = { workspace = true }

[lints]
workspace = true
