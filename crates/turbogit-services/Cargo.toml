[package]
name = "turbogit-services"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
similar = { workspace = true }
turbogit-domain = { workspace = true }
turbogit-engine-api = { workspace = true }

[dev-dependencies]
# `srcscan` is ungated, so this costs no egui stack — it pulls only domain and
# engine-api, which this crate already depends on.
test-support = { workspace = true }
turbogit-engine = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
